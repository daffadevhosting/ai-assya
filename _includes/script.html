<!-- ==================== SEO ENGINE & APPLICATION SCRIPT ==================== -->
  <div id="assya-config"
       data-api-endpoint="{{ site.api_endpoint | default: 'https://assya-ai.sendaljepit.workers.dev/api/chat' }}"
       data-products='{{ site.data.products | jsonify | escape }}'
       style="display:none;"></div>

  <script>
    const configEl = document.getElementById('assya-config');
    const WORKER_ENDPOINT = configEl?.dataset.apiEndpoint || 'https://assya-ai.sendaljepit.workers.dev/api/chat';
    const SESSION_ID = 'sess_' + Math.random().toString(36).substring(2, 9);
    const BASE_URL = window.location.origin + window.location.pathname;

    const rawProducts = configEl?.dataset.products || '[]';
    let allProducts = [];
    try {
      allProducts = JSON.parse(rawProducts);
    } catch (error) {
      allProducts = [];
    }

    let currentProduct = null;
    let simpleCart = [];
    let welcomeTimer = null;

    // ==========================================
    // AUTOMATED DYNAMIC SEO ENGINE
    // ==========================================
    const SEOEngine = {
      updateSEO: function(product) {
        if (!product) return;

        const productUrl = `${BASE_URL}#product-${product.id}`;
        const pageTitle = `${product.title} - Jual Bordir Tasikmalaya | As-Syariah`;
        const rawPrice = product.discount ? product.discount.replace(/\./g, '') : '15000';
        const pageDesc = `${product.description} Harga: Rp ${product.discount} (${product.stok}). Pesan langsung via WhatsApp di As-Syariah Bordir Tasikmalaya.`;

        // 1. Update Title & Canonical
        document.title = pageTitle;
        document.getElementById('canonical-url')?.setAttribute('href', productUrl);

        // 2. Update Meta Description
        let metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute('content', pageDesc);

        // 3. Update OpenGraph (Facebook / WhatsApp Share Preview)
        document.getElementById('og-title')?.setAttribute('content', pageTitle);
        document.getElementById('og-desc')?.setAttribute('content', pageDesc);
        document.getElementById('og-url')?.setAttribute('content', productUrl);
        document.getElementById('og-image')?.setAttribute('content', product.image);

        // 4. Update Twitter Card
        document.getElementById('tw-title')?.setAttribute('content', pageTitle);
        document.getElementById('tw-desc')?.setAttribute('content', pageDesc);
        document.getElementById('tw-image')?.setAttribute('content', product.image);

        // 5. Dynamic Update Schema.org Product (Rich Snippet Google)
        const productSchema = {
          "@context": "https://schema.org/",
          "@type": "Product",
          "name": product.title,
          "image": [product.image],
          "description": product.description || product.title,
          "sku": product.id,
          "mpn": product.id,
          "brand": {
            "@type": "Brand",
            "name": "As-Syariah Bordir"
          },
          "offers": {
            "@type": "Offer",
            "url": productUrl,
            "priceCurrency": "IDR",
            "price": rawPrice,
            "priceValidUntil": "2028-12-31",
            "itemCondition": "https://schema.org/NewCondition",
            "availability": product.stok === "Tersedia" ? "https://schema.org/InStock" : "https://schema.org/OutOfStock",
            "seller": {
              "@type": "Organization",
              "name": "As-Syariah Bordir"
            }
          }
        };

        const schemaTag = document.getElementById('schema-product');
        if (schemaTag) {
          schemaTag.textContent = JSON.stringify(productSchema, null, 2);
        }

        // 6. Update URL Hash tanpa reload (Deep Linking untuk Google Bot)
        if (window.location.hash !== `#product-${product.id}`) {
          history.pushState(null, null, `#product-${product.id}`);
        }
      },

      checkUrlHash: function() {
        const hash = window.location.hash;
        if (hash && hash.startsWith('#product-')) {
          const productId = hash.replace('#product-', '');
          const found = allProducts.find(p => p.id === productId);
          if (found) {
            selectProductFromMenu(found.id, false);
          }
        }
      }
    };

    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    }

    function getTimeString() {
      const now = new Date();
      return now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      if (!toast || !toastText) return;
      toastText.innerText = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2500);
    }

    function scrollToBottom() {
      setTimeout(() => {
        const content = document.getElementById('chat-content');
        if (content && typeof content.scrollToBottom === 'function') {
          content.scrollToBottom(300);
        } else if (content) {
          content.scrollTop = content.scrollHeight;
        }
      }, 100);
    }

    // ==========================================
    // WELCOME MESSAGE DINAMIS (JEDA 15 DETIK)
    // ==========================================
    function renderWelcomeMessage() {
      const container = document.getElementById('message-container');
      if (!container) return;

      // Jalankan hanya jika percakapan belum ada / masih kosong
      if (container.children.length === 0) {
        showTypingIndicator();

        welcomeTimer = setTimeout(() => {
          removeTypingIndicator();

          // Pastikan container masih kosong saat render welcome text
          if (container.children.length === 0) {
            const time = getTimeString();
            const messageWrapper = document.createElement('div');
            messageWrapper.className = 'flex flex-col items-start max-w-[90%] md:max-w-[80%] mr-auto transition-all animate-fade-in';
            messageWrapper.innerHTML = `
              <div class="bg-white rounded-lg rounded-tl-none p-3 bubble-shadow relative text-slate-800 text-xs leading-relaxed border border-gray-100">
                <p class="font-bold text-[#075e54] text-[11px] mb-1 flex items-center gap-1">
                  <span>Assya AI</span>
                  <ion-icon name="sparkles" class="text-amber-500 text-xs"></ion-icon>
                </p>

                <div class="space-y-2 text-slate-700">
                  <p>Halo 👋, saya <b>ASSYA</b>, Asisten Virtual As-Syariah Bordir Tasikmalaya yang siap membantu Anda.<br/>Ada yang bisa Assya bantu hari ini? Anda bisa bertanya seputar produk bordir komputer, lokasi toko, atau memilih produk langsung dari katalog!</p>

                  <p class="text-[11px] bg-[#ffeecd] p-2 rounded border border-slate-200/60 text-slate-600 leading-normal">
                    Perlu diketahui bahwa percakapan ini berbasis AI untuk melayani pesanan produk bordir Anda secara otomatis.<br/><br/>
                    <i>Dengan melanjutkan percakapan ini, pengguna dianggap telah memahami dan menyetujui ketentuan tersebut.</i>
                  </p>
                </div>

                <span class="text-[9px] text-gray-400 block text-right mt-1.5">${time}</span>
              </div>
            `;

            container.appendChild(messageWrapper);
            scrollToBottom();
          }
        }, 15000); // Jeda 15 detik (15000ms)
      }
    }

    async function initProducts() {
      try {
        const res = await fetch('https://as-syariahbordir.github.io/product.json');
        if (res.ok) {
          const data = await res.json();
          if (data && data.product && data.product.length > 0) {
            allProducts = data.product;
          }
        }
      } catch (err) {
        console.log('Menggunakan produk bawaan/fallback');
      }
      renderProductMenuList(allProducts);
      SEOEngine.checkUrlHash();
    }

    function openProfileModal() {
      const u = window.currentUser;
      if (u && !u.isAnonymous) {
        document.getElementById('modal-user-name').innerText = u.displayName || 'Pengguna Google';
        document.getElementById('modal-user-email').innerText = u.email || '-';
        document.getElementById('modal-user-avatar').innerHTML = `<img src="${u.photoURL}" class="w-full h-full object-cover rounded-full"/>`;
      }
      document.getElementById('user-profile-modal')?.present();
    }
    function closeProfileModal() {
      document.getElementById('user-profile-modal')?.dismiss();
    }
    window.openProfileModal = openProfileModal;

    function openProductMenu() {
      const menu = document.querySelector('ion-menu[menu-id="product-menu"]');
      if (menu) menu.open();
    }

    function closeProductMenu() {
      const menu = document.querySelector('ion-menu[menu-id="product-menu"]');
      if (menu) menu.close();
    }

    function renderProductMenuList(products) {
      const container = document.getElementById('product-list-container');
      const badge = document.getElementById('product-count-badge');
      if (badge) badge.innerText = products.length;
      if (!container) return;

      if (products.length === 0) {
        container.innerHTML = `
          <div class="p-6 text-center text-gray-400">
            <ion-icon name="search-outline" class="text-2xl mb-1"></ion-icon>
            <p class="text-xs">Produk tidak ditemukan</p>
          </div>
        `;
        return;
      }

      let html = '';
      products.forEach((p) => {
        const isSelected = currentProduct && p.id === currentProduct.id;
        const stockText = p.stok || 'Tersedia';
        const isStockEmpty = /habis|sold out|out of stock|kosong/i.test(stockText);
        const stockClass = isStockEmpty
          ? 'text-[9px] text-rose-700 bg-rose-100 px-1 py-0.2 rounded font-medium flex-shrink-0'
          : 'text-[9px] text-emerald-700 bg-emerald-50 px-1 py-0.2 rounded font-medium flex-shrink-0';

        html += `
          <a href="#product-${p.id}" onclick="selectProductFromMenu('${p.id}'); return false;" class="block px-3 py-2.5 bg-white hover:bg-slate-50 cursor-pointer flex gap-2.5 items-center transition-colors relative ${isSelected ? 'bg-emerald-50/50' : ''}">
            ${isSelected ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-emerald-600"></div>' : ''}
            
            <div class="relative flex-shrink-0">
              <img src="${p.image}" class="w-10 h-10 rounded-full object-cover border border-gray-200" alt="${p.title}" />
              ${isSelected ? '<span class="absolute -bottom-0.5 -right-0.5 bg-emerald-600 text-white p-0.5 rounded-full text-[8px] flex items-center justify-center border border-white"><ion-icon name="checkmark"></ion-icon></span>' : ''}
            </div>

            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center">
                <h3 class="font-bold text-xs text-slate-800 truncate pr-1 leading-tight">${p.title}</h3>
                <span class="text-[11px] font-extrabold text-[#075e54] flex-shrink-0">Rp ${p.discount}</span>
              </div>
              <div class="flex justify-between items-center mt-0.5">
                <p class="text-[10px] text-gray-500 truncate max-w-[140px]">${p.description || 'Produk Bordir Tasikmalaya'}</p>
                <span class="${stockClass}">${stockText}</span>
              </div>
            </div>
          </a>
        `;
      });

      container.innerHTML = html;
    }

    function filterProducts() {
      const query = document.getElementById('search-product-input').value.toLowerCase();
      const filtered = allProducts.filter(p => 
        p.title.toLowerCase().includes(query) || 
        (p.description && p.description.toLowerCase().includes(query)) ||
        (p.styles && p.styles.some(s => s.name.toLowerCase().includes(query)))
      );
      renderProductMenuList(filtered);
    }

    function selectProductFromMenu(productId, triggerGreeting = true) {
      const foundProduct = allProducts.find(p => p.id === productId);
      if (!foundProduct) return;

      currentProduct = foundProduct;
      renderProductMenuList(allProducts); 

      SEOEngine.updateSEO(currentProduct);

      if (window.innerWidth < 768) {
        closeProductMenu();
      }

      showToast(`Membahas: ${currentProduct.title}`);
      if (triggerGreeting) {
        // Jika user langsung pilih produk, batalkan timer welcome agar tidak tumpang tindih
        if (welcomeTimer) clearTimeout(welcomeTimer);
        removeTypingIndicator();
        sendProductDetailGreeting(currentProduct);
      }
    }

    function sendProductDetailGreeting(product) {
      const colors = product.styles?.map(s => s.name).join(', ') || 'pilihan warna standar';

      let detailMessage = `✨ **${product.title}** ✨\n\n`;
      if (product.price && product.price !== product.discount) {
        detailMessage += `Rp ~~${product.price}~~ ➡️ **Rp ${product.discount}**\n`;
      } else {
        detailMessage += `💰 **Harga:** Rp ${product.discount}\n`;
      }
      detailMessage += `📦 **Status Stok:** ${product.stok || 'Tersedia'}\n`;
      detailMessage += `🎨 **Varian Warna:** ${colors}\n`;
      if (product.description) {
        detailMessage += `📝 **Deskripsi:** ${product.description}\n`;
      }
      detailMessage += `\nKakak mau beli produk ini atau ada yang mau ditanyakan? (Ketik *"mau beli"* atau *"semua warna"* untuk melihat varian!) 😊`;

      let extraData = null;
      if (product.styles && product.styles.length > 0) {
        extraData = {
          type: 'showImages',
          images: product.styles
        };
      }

      addBotMessageWithTyping(detailMessage, extraData, 1000);
    }

    function addMultipleToCart(items) {
      if (!Array.isArray(items)) return;

      items.forEach(item => {
        const existingIdx = simpleCart.findIndex(c => c.name === item.name && c.warna === item.warna);
        if (existingIdx > -1) {
          simpleCart[existingIdx].quantity += (item.quantity || item.qty || 1);
        } else {
          simpleCart.push({
            name: item.name || 'Produk Bordir',
            price: item.price || 15600,
            quantity: item.quantity || item.qty || 1,
            warna: item.warna || item.color || 'standar',
            link: item.link || 'https://placehold.co/100x100?text=Bordir'
          });
        }
      });
      updateCartUI();
    }

    function updateCartUI() {
      const badge = document.getElementById('cart-badge');
      const totalQuantity = simpleCart.reduce((sum, item) => sum + item.quantity, 0);

      if (badge) {
        if (totalQuantity > 0) {
          badge.innerText = totalQuantity;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }

      const container = document.getElementById('cart-items-container');
      const emptyState = document.getElementById('cart-empty-state');
      const footer = document.getElementById('cart-footer');

      if (!container) return;

      if (simpleCart.length === 0) {
        container.innerHTML = '';
        emptyState?.classList.remove('hidden');
        footer?.classList.add('hidden');
        return;
      }

      emptyState?.classList.add('hidden');
      footer?.classList.remove('hidden');

      let html = '';
      let grandTotal = 0;

      simpleCart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        grandTotal += itemTotal;

        html += `
          <div class="bg-white p-2.5 rounded-xl border border-gray-200/80 shadow-xs flex gap-2.5 items-center">
            <img src="${item.link}" alt="${item.name}" class="w-12 h-12 rounded-lg object-cover bg-gray-100 border border-gray-100" />
            <div class="flex-1">
              <h4 class="font-bold text-xs text-slate-800 line-clamp-1">${item.name}</h4>
              <p class="text-[10px] text-gray-500">Warna: <span class="font-semibold text-slate-700 capitalize">${item.warna}</span></p>
              <p class="text-[11px] font-semibold text-[#075e54] mt-0.5">${formatRupiah(item.price)} x ${item.quantity}</p>
            </div>
            <div class="text-right">
              <p class="text-xs font-bold text-slate-800">${formatRupiah(itemTotal)}</p>
              <button onclick="removeCartItem(${index})" class="text-[11px] text-rose-500 font-medium mt-0.5">Hapus</button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      document.getElementById('cart-item-count').innerText = `${totalQuantity} pcs`;
      document.getElementById('cart-total').innerText = formatRupiah(grandTotal);
    }

    function removeCartItem(index) {
      simpleCart.splice(index, 1);
      updateCartUI();
    }

    function checkoutToWhatsApp() {
      if (simpleCart.length === 0) return;

      let msg = `Halo Admin As-Syariah Bordir, saya mau checkout pesanan dari Assya AI:\n\n`;
      let total = 0;

      simpleCart.forEach((item, i) => {
        const sub = item.price * item.quantity;
        total += sub;
        msg += `${i + 1}. *${item.name}*\n   • Warna: ${item.warna}\n   • Jumlah: ${item.quantity} pcs\n   • Subtotal: ${formatRupiah(sub)}\n\n`;
      });

      msg += `💰 *Total Pembayaran:* ${formatRupiah(total)}\n\nMohon diproses pesanan saya ya kak! Terima kasih.`;

      if (typeof window.savePurchaseToFirestore === 'function') {
        window.savePurchaseToFirestore(simpleCart, total);
      }

      const targetWa = '6285156416662'; 
      const waUrl = `https://wa.me/${targetWa}?text=${encodeURIComponent(msg)}`;
      window.open(waUrl, '_blank');
    }

    function openCartModal() { document.getElementById('cart-modal')?.present(); }
    function closeCartModal() { document.getElementById('cart-modal')?.dismiss(); }
    function openStoreInfoModal() { document.getElementById('store-info-modal')?.present(); }
    function closeStoreInfoModal() { document.getElementById('store-info-modal')?.dismiss(); }

    function addMessageToUI(sender, text, extraData = null) {
      const container = document.getElementById('message-container');
      if (!container) return;
      const time = getTimeString();

      if (typeof window.saveChatToFirestore === 'function') {
        window.saveChatToFirestore(sender, text);
      }

      const messageWrapper = document.createElement('div');
      messageWrapper.className = `flex flex-col ${sender === 'user' ? 'items-end' : 'items-start'} max-w-[90%] md:max-w-[80%] ${sender === 'user' ? 'ml-auto' : 'mr-auto'}`;

      if (sender === 'user') {
        messageWrapper.innerHTML = `
          <div class="bg-[#dcf8c6] rounded-lg rounded-tr-none p-2.5 bubble-shadow relative text-slate-800 text-xs">
            <p class="whitespace-pre-line">${escapeHTML(text)}</p>
            <div class="flex items-center justify-end gap-1 mt-1">
              <span class="text-[9px] text-gray-500">${time}</span>
              <ion-icon name="checkmark-done" class="text-blue-500 text-xs"></ion-icon>
            </div>
          </div>
        `;
      } else {
        let galleryHTML = '';
        if (extraData && extraData.type === 'showImages' && extraData.images) {
          galleryHTML = `<div class="mt-2 grid grid-cols-2 gap-1.5">`;
          extraData.images.forEach(img => {
            galleryHTML += `
              <div class="bg-gray-100 rounded-lg overflow-hidden border border-gray-200">
                <img src="${img.image_path}" class="w-full h-40 object-cover" alt="${img.name}" />
                <p class="text-[9px] text-center font-bold text-slate-700 py-0.5 capitalize">${img.name}</p>
              </div>
            `;
          });
          galleryHTML += `</div>`;
        }

        messageWrapper.innerHTML = `
          <div class="bg-white rounded-lg rounded-tl-none p-2.5 bubble-shadow relative text-slate-800 text-xs">
            <p class="font-bold text-[#075e54] text-[11px] mb-0.5">Assya AI</p>
            <div class="whitespace-pre-line leading-relaxed">${formatMarkdownText(text)}</div>
            ${galleryHTML}
            <span class="text-[9px] text-gray-400 block text-right mt-1">${time}</span>
          </div>
        `;
      }

      container.appendChild(messageWrapper);
      scrollToBottom();
    }

    function addBotMessageWithTyping(text, extraData = null, delay = 900) {
      showTypingIndicator();
      setTimeout(() => {
        removeTypingIndicator();
        addMessageToUI('bot', text, extraData);
      }, delay);
    }

    function showTypingIndicator() {
      const statusText = document.getElementById('store-status');
      if (statusText) {
        statusText.innerText = 'Assya sedang mengetik...';
        statusText.classList.add('text-amber-300');
      }

      const container = document.getElementById('message-container');
      if (!container || document.getElementById('wa-typing-bubble')) return;

      const typingWrapper = document.createElement('div');
      typingWrapper.id = 'wa-typing-bubble';
      typingWrapper.className = 'flex flex-col items-start max-w-[80%] mr-auto transition-all';
      typingWrapper.innerHTML = `
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;

      container.appendChild(typingWrapper);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const statusText = document.getElementById('store-status');
      if (statusText) {
        statusText.innerText = 'Online | As-Syariah Bordir';
        statusText.classList.remove('text-amber-300');
      }

      const bubble = document.getElementById('wa-typing-bubble');
      if (bubble) bubble.remove();
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function formatMarkdownText(text) {
      let formatted = escapeHTML(text);
      const urlRegex = /(https?:\/\/[^\s<]+)/g;
      formatted = formatted.replace(urlRegex, function(url) {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="chat-link">${url}</a>`;
      });
      formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      formatted = formatted.replace(/\*(.*?)\*/g, '<i>$1</i>');
      formatted = formatted.replace(/~~(.*?)~~/g, '<s>$1</s>');
      return formatted;
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      // Jika user langsung mengirim pesan sebelum timer welcome selesai, batalkan timer welcome
      if (welcomeTimer) clearTimeout(welcomeTimer);

      input.value = '';
      addMessageToUI('user', text);
      showTypingIndicator();

      const userObj = window.currentUser && !window.currentUser.isAnonymous ? {
        uid: window.currentUser.uid,
        name: window.currentUser.displayName || null,
        email: window.currentUser.email || null
      } : null;

      try {
        const payload = {
          message: text,
          productId: currentProduct ? currentProduct.id : null,
          product: currentProduct,
          sessionId: SESSION_ID,
          user: userObj
        };

        const response = await fetch(WORKER_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        removeTypingIndicator();

        if (response.ok) {
          const data = await response.json();
          let extraImagesData = null;
          if (data.action && data.action.type === 'showImages') {
            extraImagesData = {
              type: 'showImages',
              images: data.action.data?.images || []
            };
          }

          addMessageToUI('bot', data.response, extraImagesData);

          if (data.action) {
            handleWorkerAction(data.action);
          }
        } else {
          addMessageToUI('bot', "Maaf kak, ada kendala jaringan ke server Assya. Silakan coba sebentar lagi ya!");
        }

      } catch (err) {
        removeTypingIndicator();
        addMessageToUI('bot', "Gagal terhubung ke Assya Worker. Pastikan koneksi internet Anda lancar!");
      }
    }

    function handleWorkerAction(action) {
      if (!action) return;

      switch (action.type) {
        case 'addMultipleToCart':
          if (Array.isArray(action.data)) {
            addMultipleToCart(action.data);
            showToast('Item dimasukkan ke keranjang!');
          }
          break;
        case 'checkout':
          if (action.data && action.data.cartItems) {
            addMultipleToCart(action.data.cartItems);
          }
          if (typeof window.savePurchaseToFirestore === 'function' && action.data) {
            window.savePurchaseToFirestore(simpleCart, action.data.total);
          }
          showToast('Pesanan dikonfirmasi!');
          setTimeout(() => { openCartModal(); }, 800);
          break;
        case 'openCart':
          setTimeout(() => { openCartModal(); }, 600);
          break;
        case 'openMenu':
          setTimeout(() => { openProductMenu(); }, 600);
          break;
      }
    }

    function sendQuickMessage(text) {
      document.getElementById('user-input').value = text;
      sendMessage();
    }

    function handleKeyPress(event) {

<script>
(() => {
  "use strict";

  const PWA_CONFIG = {
    serviceWorker: "/sw.js",
    themeColor: "#075e54",
    appName: "Assya AI"
  };

  let deferredInstallPrompt = null;

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try {
        const registration = await navigator.serviceWorker.register(
          PWA_CONFIG.serviceWorker,
          { scope: "/" }
        );
        console.log("[PWA] Service Worker aktif:", registration.scope);
      } catch (error) {
        console.error("[PWA] Gagal register Service Worker:", error);
      }
    });
  }

  window.addEventListener("beforeinstallprompt", event => {
    console.log("[PWA] beforeinstallprompt tersedia");
    event.preventDefault();
    deferredInstallPrompt = event;
    document.documentElement.classList.add("pwa-installable");
    window.dispatchEvent(new CustomEvent("assya:pwa-installable"));
  });

  window.installAssyaPWA = async function () {
    if (!deferredInstallPrompt) {
      console.log("[PWA] Install prompt belum tersedia.");
      return false;
    }

    try {
      deferredInstallPrompt.prompt();
      const result = await deferredInstallPrompt.userChoice;
      console.log("[PWA] User choice:", result.outcome);
      deferredInstallPrompt = null;
      document.documentElement.classList.remove("pwa-installable");
      return result.outcome === "accepted";
    } catch (error) {
      console.error("[PWA] Install error:", error);
      return false;
    }
  };

  window.addEventListener("appinstalled", () => {
    console.log("[PWA] Assya AI berhasil diinstall.");
    deferredInstallPrompt = null;
    document.documentElement.classList.remove("pwa-installable");
    window.dispatchEvent(new CustomEvent("assya:pwa-installed"));
  });

  window.isAssyaPWA = function () {
    return (
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true
    );
  };

  function updateThemeColor(color) {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      meta.setAttribute("content", color);
    }
  }

  updateThemeColor(PWA_CONFIG.themeColor);
})();
</script>
