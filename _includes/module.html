  <script type="module">
    import { onAuthStateChanged, signOut, signInAnonymously, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Gunakan auth dari script.html (sudah diinisialisasi dengan config dari Worker)
    const auth = window.fbAuth || null;
    const appId = 'as-syariahputra';

    const BASE_WORKER_URL = 'https://assya-ai.sendaljepit.workers.dev'

    window.fbAppId = appId;

    let currentUser = null;

    // Jika auth belum ada, tunggu sebentar (fallback)
    function waitForAuth() {
      if (window.fbAuth) {
        setupAuthListener();
      } else {
        setTimeout(waitForAuth, 200);
      }
    }

    function setupAuthListener() {
      const currentAuth = window.fbAuth || auth;
      if (!currentAuth) return;
      
      // Cek apakah sudah ada listener (hindari duplicate)
      if (window.authListenerSetup) return;
      window.authListenerSetup = true;

      onAuthStateChanged(currentAuth, (user) => {
        currentUser = user;
        window.currentUser = user;
        updateAuthUI(user);

        if (user && !user.isAnonymous) {
          listenUserPurchaseHistory(user.uid);
        }
      });
    }

    // Mulai tunggu auth
    waitForAuth();

    window.loginWithGoogle = async function() {
      const currentAuth = window.fbAuth || auth;
      if (!currentAuth) {
        showToast("Firebase belum siap. Silakan tunggu sebentar.");
        return;
      }
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(currentAuth, provider);
        showToast(`Selamat datang, ${result.user.displayName || 'Pengguna'}!`);
      } catch (error) {
        showToast("Proses login Google dibatalkan atau gagal.");
      }
    };

    window.logoutUser = async function() {
      const currentAuth = window.fbAuth || auth;
      if (!currentAuth) {
        showToast("Firebase belum siap. Silakan tunggu sebentar.");
        return;
      }
      try {
        const uid = currentAuth.currentUser?.uid;
        if (uid) {
          await clearAllChatHistory();
        }
        await signOut(currentAuth);
        await signInAnonymously(currentAuth);
        clearChatContainer();
        showToast("Berhasil keluar dari akun.");
        closeProfileModal();
      } catch (error) {
        console.error("Error logout:", error);
      }
    };

    function clearChatContainer() {
      const chatContainer = document.getElementById('chat-messages-container');
      if (chatContainer) {
        chatContainer.innerHTML = `
          <div class="text-center py-8 text-gray-500">
            <ion-icon name="chatbubble-ellipses-outline" class="text-5xl mb-3 text-emerald-600"></ion-icon>
            <p class="text-sm font-medium text-slate-700">Selamat Datang di As-Syariah Bordir</p>
            <p class="text-xs text-gray-500 mt-1">Mulai percakapan dengan Assya AI</p>
          </div>
        `;
      }
    }

    window.clearAllChatHistory = async function() {
      const currentAuth = window.fbAuth || auth;
      const uid = currentAuth?.currentUser?.uid;
      if (!uid) {
        showToast("Anda belum login!");
        return;
      }
      
      try {
        const response = await fetch(`${BASE_WORKER_URL}/api/clear-chat?uid=${uid}`, {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json'
          }
        });
        
        if (response.ok) {
          clearChatContainer();
          showToast("Riwayat chat berhasil dihapus!");
        } else {
          showToast("Gagal menghapus riwayat chat.");
        }
      } catch (err) {
        console.error("Error menghapus history chat KV:", err);
        showToast("Gagal menghapus riwayat chat.");
      }
    };

    window.saveChatToKV = async function(sender, messageText) {
      const currentAuth = window.fbAuth || auth;
      const uid = currentAuth?.currentUser?.uid;
      if (!uid) return;
      try {
        await fetch('${BASE_WORKER_URL}/api/save-chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            uid: uid,
            sender: sender,
            text: messageText
          })
        });
      } catch (err) {
        console.error("Gagal menyimpan percakapan ke KV:", err);
      }
    };

    window.savePurchaseToKV = async function(cartItems, totalAmount) {
      const currentAuth = window.fbAuth || auth;
      const uid = currentAuth?.currentUser?.uid;
      if (!uid) return;
      try {
        await fetch('${BASE_WORKER_URL}/api/save-purchase', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            uid: uid,
            items: cartItems,
            total: totalAmount
          })
        });
        showToast("Transaksi tersimpan di Riwayat Pembelian!");
      } catch (err) {
        console.error("Gagal menyimpan transaksi ke KV:", err);
      }
    };

    async function loadUserPurchasesFromKV(uid) {
      try {
        const response = await fetch(`${BASE_WORKER_URL}/api/purchases?uid=${uid}`);
        if (response.ok) {
          const data = await response.json();
          return data.purchases || [];
        }
      } catch (err) {
        console.error("Gagal memuat riwayat pembelian dari KV:", err);
      }
      return [];
    }

    async function listenUserPurchaseHistory(uid) {
      const purchases = await loadUserPurchasesFromKV(uid);
      renderPurchaseHistoryUI(purchases);
    }

    function updateAuthUI(user) {
      const chip = document.getElementById('user-auth-chip');
      const avatarContainer = document.getElementById('user-chip-avatar');
      const label = document.getElementById('user-chip-label');

      if (user && !user.isAnonymous) {
        const photoUrl = user.photoURL || `https://placehold.co/80x80/075e54/white.png?text=${user.displayName ? user.displayName.charAt(0) : 'U'}`;
        const name = user.displayName ? user.displayName.split(' ')[0] : 'Profil';

        avatarContainer.innerHTML = `<img src="${photoUrl}" class="w-full h-full object-cover rounded-full" />`;
        label.innerText = name;
        chip.onclick = window.openProfileModal;
        chip.className = "bg-emerald-700/80 hover:bg-emerald-700 text-white text-xs px-2 py-1 rounded-full flex items-center gap-1.5 border border-emerald-400/40 cursor-pointer transition-all";
      } else {
        avatarContainer.innerHTML = `<ion-icon name="logo-google" class="text-white text-sm"></ion-icon>`;
        label.innerText = "Login Google";
        chip.onclick = window.loginWithGoogle;
        chip.className = "bg-emerald-800/60 hover:bg-emerald-800 text-white text-xs px-2.5 py-1 rounded-full flex items-center gap-1.5 border border-emerald-500/30 cursor-pointer transition-all active:scale-95";
      }
    }

    function renderPurchaseHistoryUI(purchases) {
      const container = document.getElementById('purchase-history-container');
      const countBadge = document.getElementById('purchase-count-badge');
      if (!container) return;

      if (countBadge) countBadge.innerText = `${purchases.length} Pesanan`;

      if (purchases.length === 0) {
        container.innerHTML = `
          <div class="text-center py-6 text-gray-400">
            <ion-icon name="bag-handle-outline" class="text-3xl mb-1"></ion-icon>
            <p class="text-xs">Belum ada riwayat pembelian</p>
          </div>
        `;
        return;
      }

      let html = '';
      purchases.reverse().forEach((p) => {
        const dateStr = p.formattedDate || 'Baru Saja';
        html += `
          <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-xs mb-2">
            <div class="flex justify-between items-center border-b border-gray-100 pb-1.5 mb-2 text-[10px]">
              <span class="text-gray-500">${dateStr}</span>
              <span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">${p.status || 'Diperiksa'}</span>
            </div>
            <div class="space-y-1">
              ${p.items.map(item => `
                <div class="flex justify-between items-center text-xs">
                  <span class="font-medium text-slate-800">${item.name} (${item.warna})</span>
                  <span class="text-gray-600">${item.quantity}x Rp ${item.price.toLocaleString('id-ID')}</span>
                </div>
              `).join('')}
            </div>
            <div class="flex justify-between items-center border-t border-dashed border-gray-200 pt-2 mt-2 text-xs">
              <span class="font-bold text-slate-700">Total Harga</span>
              <span class="font-extrabold text-[#075e54]">Rp ${p.total.toLocaleString('id-ID')}</span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }
  </script>
