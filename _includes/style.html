  <style>
body {
  padding-top: 0;
}

ion-app {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
    :root {
      --wa-header: #075e54;
      --wa-header-dark: #054c44;
      --wa-green: #25d366;
      --wa-bg: #efeae2;
      --wa-bubble-out: #dcf8c6;
      --wa-bubble-in: #ffffff;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    ion-content.wa-chat-bg {
      --background: var(--wa-bg);
      background-image: radial-gradient(#cbd5e1 1px, transparent 0);
      background-size: 16px 16px;
    }

    .bubble-shadow { box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13); }
    .chat-link { color: #0284c7; text-decoration: underline; font-weight: 500; word-break: break-all; }
    .chat-link:hover { color: #0369a1; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }

    .online-pulse {
      width: 8px; height: 8px; background-color: #25d366; border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(37, 211, 102, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }

    .typing-indicator {

    }

      width: 6px; height: 6px; background-color: #075e54; border-radius: 50%;
      opacity: 0.4; animation: typingWave 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingWave {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    ion-split-pane {
      --side-width: 320px; --side-max-width: 360px; --border: 1px solid #e2e8f0;
